name: Quality and Docker smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALLOW_REGISTRATION: 'true'
      AI_MODE: demo
      OPENAI_API_KEY: ''
      OPENAI_MODEL: ''
      COMPOSE_PROJECT_NAME: ai-job-hunter-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Build public demo
        run: npm run build:demo
      - name: Configure temporary database
        shell: bash
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Build Docker images
        run: docker compose build
      - name: Start isolated stack
        run: docker compose up -d --no-build --wait --wait-timeout 120
      - name: Smoke test through Nginx and PostgreSQL
        run: npm run smoke
        env:
          SMOKE_ALLOW_WRITES: 'true'
          SMOKE_BASE_URL: http://127.0.0.1:8080
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Remove ephemeral CI stack
        if: always()
        run: docker compose down -v --remove-orphans
